version: "3.8"

# ==============================================================================
# NetMind AI - Multi-Container Orchestration (Phase 5 Deployment)
# ==============================================================================
# Services:
# 1. postgres: Persistent relational database with pg_isready healthcheck.
# 2. backend: FastAPI intelligence & decision support service waiting on DB healthcheck.
# 3. worker: Resilient background daemon streaming Zeek & Suricata logs with offset tracking.
# 4. frontend: React 18 production SOC dashboard served via Nginx with API reverse proxy.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Persistent Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: netmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmind_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmind_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-netmind_telemetry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netmind_admin} -d ${POSTGRES_DB:-netmind_telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - netmind-network

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend API & Decision Support Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netmind-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-netmind_admin}:${POSTGRES_PASSWORD:-netmind_secure_password}@postgres:5432/${POSTGRES_DB:-netmind_telemetry}
      NETMIND_ENV: ${NETMIND_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - netmind-network

  # ----------------------------------------------------------------------------
  # 3. Log-Tailing Background Daemon Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netmind-worker
    restart: unless-stopped
    command: ["python", "src/worker/log_tailer.py", "--loop", "--poll-interval", "1.0"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-netmind_admin}:${POSTGRES_PASSWORD:-netmind_secure_password}@postgres:5432/${POSTGRES_DB:-netmind_telemetry}
      ZEEK_LOG_PATH: /app/logs/conn.log
      SURICATA_EVE_PATH: /app/logs/eve.json
      CHECKPOINT_FILE: /app/logs/.tailer_checkpoint.json
      POLL_INTERVAL: 1.0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    networks:
      - netmind-network

  # ----------------------------------------------------------------------------
  # 4. React Production SOC Interface (Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netmind-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - netmind-network

volumes:
  postgres_data:
    name: netmind_postgres_data

networks:
  netmind-network:
    name: netmind-network
    driver: bridge
